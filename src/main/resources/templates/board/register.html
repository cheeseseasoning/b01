<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
	crossorigin="anonymous">

<title>Board Register</title>
</head>
<body>

	<div class="container-fluid">
		<div class="row">
			<!-- Header Navbar -->
			<div class="row">
				<div class="col">
					<nav class="navbar navbar-expand-lg navbar-light bg-light">
						<div class="container-fluid">
							<a class="navbar-brand" href="#">Navbar</a>
							<button class="navbar-toggler" type="button"
								data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
								aria-controls="navbarNavAltMarkup" aria-expanded="false"
								aria-label="Toggle navigation">
								<span class="navbar-toggler-icon"></span>
							</button>
							<div class="collapse navbar-collapse" id="navbarNavAltMarkup">
								<div class="navbar-nav">
									<a class="nav-link active" aria-current="page" href="#">Home</a>
									<a class="nav-link" href="#">Features</a> <a class="nav-link"
										href="#">Pricing</a> <a class="nav-link disabled">Disabled</a>
								</div>
							</div>
						</div>
					</nav>
				</div>
			</div>
			<!-- Header End -->

			<div class="row content">
				<div class="col">
					<div class="card">
						<div class="card-header">Board Register</div>
						<div class="card-body">

							<!-- Register Form -->
							<form id="bForm" th:action="@{/board/register}" method="post"
								enctype="multipart/form-data">

								<!-- Title -->
								<div class="input-group mb-3">
									<span class="input-group-text">Title</span> <input type="text"
										name="title" id="title" class="form-control"
										placeholder="Title">
								</div>

								<!-- Content (게시판 본문 입력창) -->
								<div class="input-group mb-3">
									<span class="input-group-text">Content</span>
									<textarea name="content" id="content" class="form-control"
										rows="5" placeholder="Content"></textarea>
								</div>

								<!-- Writer -->
								<div class="input-group mb-3">
									<span class="input-group-text">Writer</span> <input type="text"
										name="writer" id="writer" class="form-control"
										th:value="${#authentication.principal.username}"
										readonly="readonly"
										placeholder="Writer ID">
								</div>

								<div class="input-group mb-3">
									<span class="input-group-text">Images</span>
									<!-- 업로드된 파일 이름을 hidden으로 담을 영역 -->
									<div class="float-end uploadHidden">
										<button type="button" class="btn btn-primary uploadFileBtn">ADD Files</button>
									</div>
								</div>

								<!-- Buttons -->
								<div class="my-4">
									<div class="float-end">
										<button type="submit" class="btn btn-primary" id="btnSubmit">Submit</button>
										<button type="reset" class="btn btn-secondary">Reset</button>
									</div>
								</div>
							</form>

						</div>
					</div>
				</div>
			</div>
			
			<!-- 첨부 파일 섬네일을 보여줄 부분 -->
			<div class="row mt-3">
				<div class="col">
					<div class="container-fluid d-flex uploadResult" style="flex-wrap: wrap;"></div>
				</div>
			</div>

			<!-- register modal -->
			<div class="modal uploadModal" tabindex="-1">
				<div class="modal-dialog">
					<div class="modal-content">
						<div class="modal-header">
							<h5 class="modal-title">Upload File</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal"
								aria-label="Close"></button>
						</div>
						<div class="modal-body">
							<div class="input-group mb-3">
								<input type="file" name="files" class="form-control" multiple>
							</div>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-primary uploadBtn">Upload</button>
							<button type="button" class="btn btn-outline-dark closeUploadBtn">Close</button>
						</div>
					</div>
				</div>
			</div>

			<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
			<script src="/js/upload.js"></script>

		</div>
	</div>

	<!-- Footer -->
	<div class="row footer">
		<div class="row fixed-bottom" style="z-index: -100">
			<footer class="py-1 my-1">
				<p class="text-center text-muted">Footer</p>
			</footer>
		</div>
	</div>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
		crossorigin="anonymous"></script>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"
		integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
		crossorigin="anonymous"></script>

	<!-- 핵심 스크립트 영역 -->
	<script>
	
		// 1. 빨간색 X를 누르면 서버 폴더에서 실제 파일을 지우고 화면 썸네일 카드도 삭제하는 함수
		function removeFile(uuid, fileName, obj) {
			console.log(uuid);
			console.log(fileName);

			const targetDiv = obj.closest(".card");

			removeFileToServer(uuid, fileName).then(data => {
				targetDiv.remove();
			});
		}

		// 2. 썸네일 화면 출력을 담당하는 함수 (중복 꼬임 방지: insertAdjacentHTML 사용)
		function showUploadFile({uuid, fileName, link}){
			const uploadResult = document.querySelector(".uploadResult");
			const realFileName = fileName || arguments[0].filename;

			const str = `<div class="card col-4">
					<div class="card-header d-flex justify-content-center">
						${realFileName}
						<button class="btn-sm btn-danger ms-2" type="button" onclick="removeFile('${uuid}', '${realFileName}', this)">X</button>
					</div>
					<div class="card-body d-flex justify-content-center">
						 <img src="/view/${link}" data-src="${uuid+"_"+realFileName}" style="width:100px; height:100px; object-fit:cover;">
					</div>
				</div><!-- card -->`;

			uploadResult.insertAdjacentHTML("beforeend", str);
		}

		$(document).ready(function() {
			// 부트스트랩 모달 객체 생성
			const uploadModal = new bootstrap.Modal(document.querySelector(".uploadModal"));

			// 'ADD Files' 버튼을 누르면 모달창이 나타남
			$(".uploadFileBtn").on("click", function(e) {
				e.preventDefault();
				e.stopPropagation();
				uploadModal.show();
			});

			// 모달 안의 'Close' 버튼을 누르면 모달창이 닫힘
			$(".closeUploadBtn").on("click", function(e) {
				e.preventDefault();
				e.stopPropagation();
				uploadModal.hide();
			});
			
			// 모달 안의 Upload 버튼 클릭 시 비동기 파일 전송 및 썸네일 출력
			document.querySelector(".uploadBtn").addEventListener("click", function(e){
				const formObj = new FormData();
				const fileInput = document.querySelector("input[name='files']");
				
				const files = fileInput.files;
				for (let i = 0; i < files.length; i++) {
					formObj.append("files", files[i]);
				}

				uploadToServer(formObj).then(result => {
					for (const uploadResult of result) {
						showUploadFile(uploadResult);
					}
					uploadModal.hide();
				}).catch(e => {
					uploadModal.hide();
				});
			}, false);
		});
	</script>
	
	<script th:inline="javascript">
	
		const auth = [[${#authentication.principal}]];

		$(document).ready(function() {
			// 서버 검증 에러(BindingResult FlashAttribute) alert 띄우기
			const errors = /*[[${errors}]]*/[];
			if (errors && errors.length > 0) {
				let msg = "";
				$.each(errors, function(index, error) {
					msg += `${error.field} : ${error.defaultMessage}\n`;
				});
				alert(msg);
			}

			// Submit 버튼 클릭 시 유효성 검사 및 첨부파일 hidden 변환 후 전송
			$("#btnSubmit").on("click", function(e) {
				e.preventDefault();
				e.stopPropagation();

				const $title = $("#title");
				const $content = $("#content");
				const $writer = $("#writer");

				// 제목 검증
				if ($.trim($title.val()) === "") {
					alert("제목을 입력해 주세요");
					$title.focus();
					return false;
				}

				// 내용 검증
				if ($.trim($content.val()) === "") {
					alert("내용을 입력해 주세요");
					$content.focus();
					return false;
				}

				// 작성자 검증
				if ($.trim($writer.val()) === "") {
					alert("작성자를 입력해 주세요");
					$writer.focus();
					return false;
				}

				// 화면에 등록된 썸네일들의 정보를 읽어 hidden input으로 변환 후 폼에 추가
				let str = "";
				const uploadFiles = document.querySelectorAll(".uploadResult img");

				for (let i = 0; i < uploadFiles.length; i++) {
					const uploadFile = uploadFiles[i];
					const imgLink = uploadFile.getAttribute("data-src");
					str += `<input type="hidden" name="fileNames" value="${imgLink}">`;
				}

				// uploadHidden 영역에 동적으로 붙여넣기
				document.querySelector(".uploadHidden").innerHTML += str;

				// 폼 전송 실행
				document.querySelector("#bForm").submit();
			});
		});
	</script>

</body>
</html>
