<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
	crossorigin="anonymous">

<title>Board Modify</title>
</head>
<body>

	<div class="container-fluid">
		<div class="row">
			<!-- Header -->
			<div class="row">
				<div class="col">
					<nav class="navbar navbar-expand-lg navbar-light bg-light">
						<div class="container-fluid">
							<a class="navbar-brand" href="#">Navbar</a>
							<button class="navbar-toggler" type="button"
								data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
								aria-controls="navbarNavAltMarkup" aria-expanded="false"
								aria-label="Toggle navigation">
								<span class="navbar-toggler-icon"></span>
							</button>
							<div class="collapse navbar-collapse" id="navbarNavAltMarkup">
								<div class="navbar-nav">
									<a class="nav-link active" aria-current="page" href="#">Home</a>
									<a class="nav-link" href="#">Features</a> <a class="nav-link"
										href="#">Pricing</a> <a class="nav-link disabled">Disabled</a>
								</div>
							</div>
						</div>
					</nav>
				</div>
			</div>
			<!-- Header End -->

			<div class="row content">
				<div class="col">
					<div class="card">
						<div class="card-header">Board Modify</div>
						<div class="card-body">
							<!-- Modify Form -->
							<form id="modifyForm"
								th:action="@{/board/modify} + '?' + ${pageRequestDTO.link}"
								method="post">

								<!-- BNO -->
								<div class="input-group mb-3">
									<span class="input-group-text">BNO</span> <input type="text"
										name="bno" class="form-control" th:value="${dto.bno}" readonly>
								</div>

								<!-- Title -->
								<div class="input-group mb-3">
									<span class="input-group-text">Title</span> <input type="text"
										name="title" class="form-control" th:value="${dto.title}">
								</div>

								<!-- Content -->
								<div class="input-group mb-3">
									<span class="input-group-text">Content</span>
									<textarea name="content" class="form-control" rows="5"
										th:text="${dto.content}"></textarea>
								</div>

								<!-- Writer -->
								<div class="input-group mb-3">
									<span class="input-group-text">Writer</span> <input type="text"
										name="writer" class="form-control" th:value="${dto.writer}"
										readonly>
								</div>

								<!-- RegDate -->
								<div class="input-group mb-3">
									<span class="input-group-text">RegDate</span> <input
										type="text" class="form-control"
										th:value="${#temporals.format(dto.regDate, 'yyyy-MM-dd HH:mm:ss')}"
										readonly>
								</div>

								<!-- ModDate -->
								<div class="input-group mb-3">
									<span class="input-group-text">ModDate</span> <input
										type="text" class="form-control"
										th:value="${#temporals.format(dto.modDate, 'yyyy-MM-dd HH:mm:ss')}"
										readonly>
								</div>

								<!-- Action Buttons -->
								<div class="my-4">
									<div class="float-end">
										<button type="button" class="btn btn-primary addFileBtn">ADD File</button>
										<button type="button" class="btn btn-danger btn-remove">Remove</button>
										<button type="button" class="btn btn-primary btn-modify">Modify</button>
										<button type="button" class="btn btn-secondary btn-list">List</button>
									</div>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
			
			<!-- 첨부 파일 섬네일을 보여줄 부분 -->
			<div class="row mt-3">
				<div class="col ">
					<div class="container-fluid d-flex uploadResult"
						style="flex-wrap: wrap;">
						<th:block th:each="fileName:${dto.fileNames}">
							<div class="card col-4" th:with="arr = ${fileName.split('_')}">
								<div class="card-header d-flex justify-content-center">
									[[${arr[1]}]]
									<button class="btn-sm btn-danger" data-uuid="[[${arr[0]}]]" data-filename="[[${arr[1]}]]">X</button>
								</div>
								<div class="card-body">
									<img th:src="|/view/s_${fileName}|" th:data-src="${fileName}">
								</div>
							</div>
							<!-- card -->
						</th:block>
					</div>
				</div>
			</div>
			
			<!-- 첨부파일 추가를 위한 모달창 -->
			<div class="modal uploadModal" tabindex="-1">
				<div class="modal-dialog">
					<div class="modal-content">
						<div class="modal-header">
							<h5 class="modal-title">Upload File</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal"
								aria-label="Close"></button>
						</div>
						<div class="modal-body">
							<div class="input-group mb-3">
								<input type="file" name="files" class="form-control" multiple>
							</div>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-primary uploadBtn">Upload</button>
							<button type="button" class="btn btn-outline-dark closeUploadBtn">Close</button>
						</div>
					</div>
				</div>
			</div>
			<!-- register modal end -->

		</div>

		<!-- Footer -->
		<div class="row footer">
			<div class="row fixed-bottom" style="z-index: -100">
				<footer class="py-1 my-1">
					<p class="text-center text-muted">Footer</p>
				</footer>
			</div>
		</div>
	</div>

	<!-- JS Libraries -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
		crossorigin="anonymous"></script>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"
		integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
		crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	<script src="/js/upload.js"></script>

	<script th:inline="javascript">
		// 1. X 버튼을 누를 때 실행되는 전역 함수 및 배열
		const removeFileList = [];

		function removeFile(uuid, fileName, obj) {
			if(!confirm("파일을 삭제하시겠습니까?")) {
				return;
			}

			// 삭제 목록에 추가
			removeFileList.push({uuid, fileName});

			// 화면에서 카드 즉시 삭제
			const targetCard = obj.closest(".card");
			if(targetCard) {
				targetCard.remove();
			}
		}

		$(document).ready(function() {
			// 유효성 검사 에러 처리
			const errors = /*[[${errors}]]*/ [];
			if (errors && errors.length > 0) {
				let errorMsg = '';
				$.each(errors, function(index, error) {
					errorMsg += `${error.field}: ${error.defaultMessage}\n`;
				});
				alert(errorMsg);
			}

			const $formObj = $("#modifyForm");
			const link = /*[[${pageRequestDTO.link}]]*/ '';
			const bno = /*[[${dto.bno}]]*/ 0;
			const removeUrl = /*[[@{/board/remove}]]*/ '/board/remove';
			const modifyUrl = /*[[@{/board/modify}]]*/ '/board/modify';
			const listUrl = /*[[@{/board/list}]]*/ '/board/list';

			// 삭제 버튼
			$(".btn-remove").on("click", function(e) {
				e.preventDefault();
				e.stopPropagation();

				if (confirm("게시글을 정말 삭제하시겠습니까?")) {
					$formObj.attr("action", `${removeUrl}?${link}`)
							.attr("method", "post")
							.submit();
				}
			});

			// 수정 버튼
			$(".btn-modify").on("click", function(e) {
				e.preventDefault();
				e.stopPropagation();

				if (!confirm("게시글을 수정하시겠습니까?")) {
					return false;
				}
				
				let str = "";

				// 1. 화면에 남아있는 파일들 수집 (기존 파일 + 새로 추가된 파일 포함)
				$(".uploadResult img").each(function(i, obj) {
					const target = $(obj);
					const val = target.attr("data-src");
					str += `<input type='hidden' name='fileNames' value='${val}'>`;
				});

				// 2. X로 삭제한 파일들(removeFileList) 서버로 전송
				for (let i = 0; i < removeFileList.length; i++) {
					const removable = removeFileList[i];
					str += `<input type='hidden' name='removeFileList[${i}].uuid' value='${removable.uuid}'>`;
					str += `<input type='hidden' name='removeFileList[${i}].fileName' value='${removable.fileName}'>`;
				}

				$formObj.append(str);
				$formObj.attr("action", `${modifyUrl}?${link}`)
						.attr("method", "post")
						.submit();
			});

			// 목록 이동 버튼
			$(".btn-list").on("click", function(e) {
				e.preventDefault();
				e.stopPropagation();

				self.location = `${listUrl}?${link}`;
			});

			// ==========================================
			// 3. 첨부파일 모달창 관련 자바스크립트 코드
			// ==========================================
			const uploadModal = new bootstrap.Modal(document.querySelector(".uploadModal"));

			// ADD File 버튼 클릭 시 모달창 열기
			$(".addFileBtn").on("click", function(e) {
				e.preventDefault();
				e.stopPropagation();
				
				uploadModal.show();
			});

			// 닫기 버튼 클릭 시 모달 닫기
			$(".closeUploadBtn").on("click", function(e) {
				uploadModal.hide();
			});

			// 업로드 모달 내의 'Upload' 버튼을 눌렀을 때
			$(".uploadBtn").on("click", function(e) {
				const formObj = new FormData();
				const fileInput = document.querySelector("input[name='files']");
				
				if (fileInput.files.length === 0) {
					alert("업로드할 파일을 선택해주세요.");
					return;
				}

				const files = fileInput.files;
				for (let i = 0; i < files.length; i++) {
					formObj.append("files", files[i]);
				}

				uploadToServer(formObj).then(result => {
					console.log(result);
					for (let i = 0; i < result.length; i++) {
						const arr = result[i];
						showUploadFile(arr);
					}
					uploadModal.hide();
					fileInput.value = '';
				}).catch(e => {
					console.error(e);
					uploadModal.hide();
				});
			});

			// 서버에서 반환된 파일 정보를 바탕으로 화면에 카드(썸네일)를 동적으로 그려주는 함수
			function showUploadFile(uploadResultDto) {
				console.log("업로드 결과 데이터:", uploadResultDto);

				const uuid = uploadResultDto.uuid;
				const fileName = uploadResultDto.filename; // 서버 응답이 소문자 filename입니다.
				const realFilename = uploadResultDto.realFilename; // uuid_filename 형태의 전체 이름

				// data-src와 뷰(View) 호출용 경로 설정 (realFilename 활용)
				const linkStr = realFilename ? realFilename : `${uuid}_${fileName}`;
				
				const str = `
					<div class="card col-4">
						<div class="card-header d-flex justify-content-center">
							${fileName}
							<button class="btn-sm btn-danger" type="button" data-uuid="${uuid}" data-filename="${fileName}">X</button>
						</div>
						<div class="card-body">
							<img src="/view/s_${linkStr}" data-src="${linkStr}">
						</div>
					</div>`;
				
				$(".uploadResult").append(str);
			}
			
			
			$(".uploadResult").on("click", ".btn-danger", e => {
				e.preventDefault();
				e.stopPropagation();

				const target = e.target;
				if (target.tagName !== "BUTTON") {
					return false;
				}
				const uuid = target.dataset.uuid;
				const filename = target.dataset.filename;
				
				removeFile(uuid, filename, target);				
			})
		});
	</script>

</body>
</html>
