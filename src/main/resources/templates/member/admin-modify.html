<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>관리자 회원 수정</title>
</head>
<body>
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h4 class="mb-0">관리자 회원 수정</h4>
        </div>

        <div class="card-body">
            <form th:action="@{/member/admin/modify}" method="post">
                <div class="mb-3">
                    <label class="form-label">아이디</label>
                    <input type="text"
                           name="mid"
                           class="form-control"
                           th:value="${dto.mid}"
                           readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">새 비밀번호</label>
                    <input type="password"
                           name="mpw"
                           class="form-control"
                           placeholder="변경하지 않으려면 비워두세요">
                </div>

                <div class="mb-3">
                    <label class="form-label">이메일</label>
                    <input type="email"
                           name="email"
                           class="form-control"
                           th:value="${dto.email}">
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox"
                           name="resetLoginFailure"
                           value="true"
                           class="form-check-input"
                           id="resetLoginFailure">
                    <label class="form-check-label" for="resetLoginFailure">
                        로그인 실패 횟수 및 잠금 초기화
                    </label>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox"
                           name="del"
                           value="true"
                           class="form-check-input"
                           id="del"
                           th:checked="${dto.del}">
                    <label class="form-check-label" for="del">탈퇴 상태</label>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox"
                           name="enabled"
                           value="true"
                           class="form-check-input"
                           id="enabled"
                           th:checked="${dto.enabled}">
                    <label class="form-check-label" for="enabled">계정 활성화</label>
                </div>

                <div class="mb-3">
                    <label class="form-label">계정 만료일</label>
                    <input type="date"
                           name="expiredDate"
                           class="form-control"
                           th:value="${dto.expiredDate}">
                </div>

                <div class="mb-3">
                    <label class="form-label">비밀번호 만료일</label>
                    <input type="date"
                           name="credentialExpiredDate"
                           class="form-control"
                           th:value="${dto.credentialExpiredDate}">
                </div>

                <button type="submit" class="btn btn-primary">관리자 수정</button>
                <a th:href="@{/member/read(mid=${dto.mid})}"
                   class="btn btn-secondary">취소</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
