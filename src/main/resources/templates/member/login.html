<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Simple Sidebar - Login</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" th:href="@{/assets/favicon.ico}" />
    <!-- Core theme CSS (includes Bootstrap)-->
	<!-- Bootstrap CSS -->
	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
		rel="stylesheet"
		integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
		crossorigin="anonymous">
    <link th:href="@{/css/styles.css}" rel="stylesheet" />
</head>
<body class="align-middle" >
<div class="container-fluid d-flex justify-content-center" style="height: 100vh">

    <div class="card align-self-center">
        <div class="card-header">
            LOGIN Page
        </div>
        <div class="card-body">
            <th:block th:if="${param.logout != null}">
                <h1>Logout........</h1>
            </th:block>

            <!-- 회원 탈퇴 완료 -->
            <div class="alert alert-success"
                 th:if="${param.withdraw != null and param.withdraw[0] == 'success'}">
                회원 탈퇴가 완료되었습니다.
            </div>

            <!-- 아이디 또는 비밀번호 오류 -->
            <div class="alert alert-danger"
                 th:if="${param.error != null and param.error[0] == 'badCredentials'}">
                아이디 또는 비밀번호가 올바르지 않습니다.
            </div>

            <!-- 계정 잠금 -->
            <div class="alert alert-danger"
                 th:if="${param.error != null and param.error[0] == 'locked'}">
                로그인 실패 횟수가 5회 이상이라 계정이 잠겼습니다.
            </div>

            <!-- 계정 사용기간 만료 -->
            <div class="alert alert-warning"
                 th:if="${param.error != null and param.error[0] == 'accountExpired'}">
                계정 사용기간이 만료되었습니다.
            </div>

            <!-- 비밀번호 사용기간 만료 -->
            <div class="alert alert-warning"
                 th:if="${param.error != null and param.error[0] == 'credentialsExpired'}">
                비밀번호 사용기간이 만료되었습니다.
            </div>

            <!-- 비활성 또는 탈퇴 계정 -->
            <div class="alert alert-warning"
                 th:if="${param.error != null and param.error[0] == 'disabled'}">
                사용할 수 없는 계정입니다.
            </div>

            <form id="registerForm" action="/member/login" method="post">
			    <input type="hidden"
			           th:name="${_csrf.parameterName}"
			           th:value="${_csrf.token}">
                                  
                <div class="input-group mb-3">
                    <span class="input-group-text">아이디</span>
                    <input type="text" name="username" class="form-control" placeholder="USER ID">
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text">패스워드</span>
                    <input type="password" name="password" class="form-control" placeholder="PASSWORD">
                </div>
                <div class="input-group mb-3 ">
                    <input class="form-check-input" type="checkbox" name="remember-me">
                    <label class="form-check-label">
                        자동 로그인
                    </label>
                </div>
                <div class="my-4">
                    <div class="float-end">
                        <a th:href="@{/member/join}"
                           class="btn btn-outline-secondary">
                            JOIN
                        </a>

                        <button type="submit" class="btn btn-primary submitBtn">LOGIN</button>
                    </div>
                </div>
            </form>
            <div>
	            <a href="/oauth2/authorization/kakao">
	            	<img src="/assets/kakao_login_medium_narrow.png"/>
	            </a>
            </div>
        </div><!--end card body-->
    </div><!--end card-->
</div>

<!-- JS Libraries -->
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
	crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"
	integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
	crossorigin="anonymous"></script>


</body>
</html>
