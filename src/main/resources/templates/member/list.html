<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>회원 목록</title>
</head>
<body>
<div class="container mt-4">
    <div class="card">
        <div class="card-header"><h4 class="mb-0">회원 목록</h4></div>
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>아이디</th>
                    <th>이메일</th>
                    <th>권한</th>
                    <th>상태</th>
                    <th>가입일</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="dto : ${pageResponseDTO.dtoList}">
                    <td>
                        <a th:href="@{/member/read(mid=${dto.mid}, page=${pageResponseDTO.page}, size=${pageResponseDTO.size})}"
                           th:text="${dto.mid}">member1</a>
                    </td>
                    <td th:text="${dto.email}">email@example.com</td>
                    <td th:text="${dto.roleSet}">[USER]</td>
                    <td th:text="${dto.del ? '탈퇴' : '정상'}"
                        th:classappend="${dto.del} ? 'text-danger' : 'text-success'">정상</td>
                    <td th:text="${#temporals.format(dto.regDate, 'yyyy-MM-dd HH:mm')}">2026-08-27</td>
                </tr>
                <tr th:if="${#lists.isEmpty(pageResponseDTO.dtoList)}">
                    <td colspan="5" class="text-center">등록된 회원이 없습니다.</td>
                </tr>
                </tbody>
            </table>

            <nav th:if="${pageResponseDTO.total > 0}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:if="${pageResponseDTO.prev}">
                        <a class="page-link" th:href="@{/member/list(page=${pageResponseDTO.start - 1}, size=${pageResponseDTO.size})}">이전</a>
                    </li>
                    <li class="page-item"
                        th:each="pageNum : ${#numbers.sequence(pageResponseDTO.start, pageResponseDTO.end)}"
                        th:classappend="${pageNum == pageResponseDTO.page} ? 'active'">
                        <a class="page-link" th:href="@{/member/list(page=${pageNum}, size=${pageResponseDTO.size})}"
                           th:text="${pageNum}">1</a>
                    </li>
                    <li class="page-item" th:if="${pageResponseDTO.next}">
                        <a class="page-link" th:href="@{/member/list(page=${pageResponseDTO.end + 1}, size=${pageResponseDTO.size})}">다음</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
