<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>회원 상세 정보</title>
</head>
<body>
<div class="container mt-4">
    <div class="card">
        <div class="card-header"><h4 class="mb-0">회원 상세 정보</h4></div>
        <div class="card-body">
            <dl class="row">
                <dt class="col-sm-3">아이디</dt>
                <dd class="col-sm-9" th:text="${dto.mid}">member1</dd>
                <dt class="col-sm-3">이메일</dt>
                <dd class="col-sm-9" th:text="${dto.email}">email@example.com</dd>
                <dt class="col-sm-3">권한</dt>
                <dd class="col-sm-9" th:text="${dto.roleSet}">[USER]</dd>

                <dt class="col-sm-3">로그인 실패 횟수</dt>
                <dd class="col-sm-9" th:text="${dto.failCount}">0</dd>

                <dt class="col-sm-3">계정 잠금</dt>
                <dd class="col-sm-9" th:text="${dto.accountLocked ? '잠김' : '정상'}">정상</dd>

                <dt class="col-sm-3">탈퇴 여부</dt>
                <dd class="col-sm-9" th:text="${dto.del ? '탈퇴' : '정상'}">정상</dd>

                <dt class="col-sm-3">활성화 여부</dt>
                <dd class="col-sm-9" th:text="${dto.enabled ? '활성' : '비활성'}">활성</dd>

                <dt class="col-sm-3">계정 만료일</dt>
                <dd class="col-sm-9"
                    th:text="${dto.expiredDate != null ? dto.expiredDate : '제한 없음'}">제한 없음</dd>

                <dt class="col-sm-3">비밀번호 만료일</dt>
                <dd class="col-sm-9"
                    th:text="${dto.credentialExpiredDate != null ? dto.credentialExpiredDate : '제한 없음'}">제한 없음</dd>

                <dt class="col-sm-3">가입일</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(dto.regDate, 'yyyy-MM-dd HH:mm')}">2026-08-27</dd>
                <dt class="col-sm-3">수정일</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(dto.modDate, 'yyyy-MM-dd HH:mm')}">2026-08-27</dd>
            </dl>
            <a class="btn btn-secondary"
               th:href="@{/member/list(page=${pageRequestDTO.page}, size=${pageRequestDTO.size})}">목록으로</a>
            <a class="btn btn-primary"
               th:href="@{/member/admin/modify(mid=${dto.mid})}">관리자 수정</a>
        </div>
    </div>
</div>
</body>
</html>
